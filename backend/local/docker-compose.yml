version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_local_only
      MYSQL_DATABASE: nextph_wordpress
      MYSQL_USER: nextph_user
      MYSQL_PASSWORD: nextph_password_local_only
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  wordpress:
    image: wordpress:6.7-php8.3-apache
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: nextph_user
      WORDPRESS_DB_PASSWORD: nextph_password_local_only
      WORDPRESS_DB_NAME: nextph_wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - ../wordpress/wp-content/plugins/nextph-core:/var/www/html/wp-content/plugins/nextph-core
      - wp_uploads:/var/www/html/wp-content/uploads

volumes:
  db_data:
  wp_uploads:
